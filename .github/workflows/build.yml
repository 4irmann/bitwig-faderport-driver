name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # one build is enough: the .bwextension runs on all platforms; Windows also builds the installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="1.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B package "-Drevision=${{ steps.version.outputs.version }}"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ext = Resolve-Path target/FaderPort4irmann.bwextension
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DExtensionPath=$ext" installer/windows/bitwig-faderport-driver.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: bitwig-faderport-driver
          path: |
            target/FaderPort4irmann.bwextension
            dist/*.exe

  macos-installer:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bitwig-faderport-driver
          path: artifacts
      - name: Build .pkg
        run: sh installer/macos/build-pkg.sh "${{ needs.build.outputs.version }}" artifacts/target/FaderPort4irmann.bwextension dist
      - name: Test install into the runner's home
        run: |
          pkg="dist/bitwig-faderport-driver-${{ needs.build.outputs.version }}.pkg"
          pkgutil --payload-files "$pkg"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          installed="$HOME/Documents/Bitwig Studio/Extensions/FaderPort4irmann.bwextension"
          ls -la "$installed"
          cmp "$installed" artifacts/target/FaderPort4irmann.bwextension
      - uses: actions/upload-artifact@v4
        with:
          name: bitwig-faderport-driver-macos
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find artifacts -type f \( -name '*-setup.exe' -o -name '*.pkg' -o -name '*.bwextension' \) -exec cp {} release/ \;
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
